<div class="media-placeholder" [class.is-video]="kind === 'video'" [style.aspect-ratio]="ratio">
  <div class="media-placeholder__grid"></div>

  @if (kind === 'video') {
    <span class="media-placeholder__play" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
        <path d="M8 5v14l11-7L8 5Z" fill="currentColor" />
      </svg>
    </span>
  } @else {
    <svg class="media-placeholder__icon" viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
      <rect x="3" y="4" width="18" height="16" rx="0" stroke="currentColor" stroke-width="1.4" />
      <circle cx="8.5" cy="9.5" r="1.6" stroke="currentColor" stroke-width="1.4" />
      <path d="M4 16.5 9 11l4 4 3-3 4 4.5" stroke="currentColor" stroke-width="1.4" />
    </svg>
  }

  <span class="media-placeholder__label">{{ label || defaultLabel }}</span>
</div>
