<header class="site-header" [class.is-scrolled]="scrolled()">
  <div class="site-header__bar container">
    <a routerLink="/" class="site-header__logo" (click)="closeMenu()">
      AP<span>.</span>
      <small>Full Stack &amp; IA</small>
    </a>

    <div class="site-header__right">
      <nav class="site-header__nav" [class.is-open]="menuOpen()">
        <ul>
          @for (item of navItems; track item.path) {
            <li>
              <a
                [routerLink]="item.path"
                routerLinkActive="is-active"
                [routerLinkActiveOptions]="{ exact: item.path === '/' }"
                (click)="closeMenu()"
              >{{ item.label }}</a>
            </li>
          }
        </ul>

        <a class="site-header__cta" routerLink="/contacto" (click)="closeMenu()">Hablemos</a>
      </nav>

      <button
        type="button"
        class="theme-toggle"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'"
        title="Cambiar tema"
      >
        @if (themeService.theme() === 'dark') {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.5" />
            <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.55 1.55M18.25 18.25l1.55 1.55M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.55-1.55M18.25 5.75l1.55-1.55" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <path stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
          </svg>
        }
      </button>

      <button
        type="button"
        class="site-header__toggle"
        [class.is-open]="menuOpen()"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Abrir menú"
      >
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
